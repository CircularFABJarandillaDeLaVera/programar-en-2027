<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Python + IA · Aula</title>
  <link rel="stylesheet" href="../../assets/edusdk-design-system/tokens/tokens.css">
  <link rel="stylesheet" href="../../assets/edusdk-design-system/tokens/semantic-tokens.css">
  <link rel="stylesheet" href="../../assets/edusdk-design-system/components/components.css">
  <link rel="stylesheet" href="bloque-theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../assets/js/theme-toggle.js" defer></script>
</head>
<body class="block-page block-page--aula">
  <div class="block-shell">
    <header class="cf-topbar cf-topbar--course block-topbar">
      <a class="block-brand" href="inicio.html" aria-label="Inicio del Bloque 7">
        <img src="../../assets/branding/logo-circular-fab.png" alt="Circular FAB">
        <span>
          <b>Circular FAB · Programar en 2027</b>
          <span>Programar en 2027 · Aula · Bloque 7</span>
        </span>
      </a>
      <nav class="cf-nav cf-nav--horizontal block-nav" aria-label="Navegacion del Bloque 7">
        <a class="cf-nav__link" href="inicio.html">Inicio</a>
        <a class="cf-nav__link is-active" href="index.html" aria-current="page">Aula</a>
        <a class="cf-nav__link" href="profesor/index.html">Profesor</a>
        <a class="cf-nav__link" href="alumno/index.html">Alumno</a>
        <a class="cf-nav__link" href="recursos/index.html">Recursos</a>
      </nav>
      <button class="cf-button cf-button--secondary theme-toggle" type="button" data-theme-toggle aria-label="Activar modo oscuro" aria-pressed="false">
        <span data-theme-icon aria-hidden="true">&#9790;</span>
        <span data-theme-label>Modo dark</span>
      </button>
    </header>

    <main class="aula-layout" aria-label="Aula del bloque">
      <section class="slide-stage cf-panel">
        <div class="slide-progress cf-progress" aria-label="Progreso de pantallas">
          <span id="slideCounter" class="cf-chip cf-chip--neutral">1 / 1</span>
          <div class="progress-wrap cf-progress__track"><div id="slideProgress" class="progress cf-progress__fill"></div></div>
        </div>
        <div id="slides" class="slides" aria-live="polite"></div>
        <div class="slide-actions">
          <button id="prevSlide" class="cf-button cf-button--secondary navbtn" type="button">Anterior</button>
          <button id="fullscreenBtn" class="cf-button cf-button--secondary navbtn" type="button">Pantalla completa</button>
          <button id="nextSlide" class="cf-button cf-button--primary navbtn" type="button">Siguiente</button>
        </div>
      </section>
    </main>
  </div>
  <script src="data/bloque7.js"></script>
  <script src="script.js"></script>
</body>
</html>
